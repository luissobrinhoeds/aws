---
- name: Destruir instancia EC2 pelo nome
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    aws_region: "{{ region }}"
    ec2_instance_name: "{{ name }}"

  tasks:

    - name: Validar parametros obrigatorios
      ansible.builtin.assert:
        that:
          - region is defined
          - region | length > 0
          - name is defined
          - name | length > 0
        fail_msg: "Informe os parametros 'region' e 'name'."

    - name: Buscar instancia pelo nome
      amazon.aws.ec2_instance_info:
        region: "{{ aws_region }}"
        filters:
          "tag:Name": "{{ ec2_instance_name }}"
      register: ec2_instances

    - name: Validar instancia encontrada
      ansible.builtin.assert:
        that:
          - ec2_instances.instances | length == 1
        fail_msg: >-
          Esperada exatamente uma instancia com o nome
          '{{ ec2_instance_name }}', mas foram encontradas
          {{ ec2_instances.instances | length }}.

    - name: Obter Instance ID
      ansible.builtin.set_fact:
        ec2_instance_id: "{{ ec2_instances.instances[0].instance_id }}"

    - name: Destruir instancia EC2
      amazon.aws.ec2_instance:
        region: "{{ aws_region }}"
        instance_ids:
          - "{{ ec2_instance_id }}"
        state: absent
        wait: true

    - name: Lista novamente o estado da instancia
      amazon.aws.ec2_instance_info:
        region: "{{ aws_region }}"
        instance_ids:
          - "{{ ec2_instance_id }}"
      register: ec2_result

    - name: Exibir resultado
      ansible.builtin.debug:
        msg:
          name: "{{ ec2_instance_name }}"
          instance_id: "{{ ec2_instance_id }}"
          region: "{{ aws_region }}"
          state: "{{ ec2_result.instances[0].state.name | default('unknown') }}"